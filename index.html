<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="left-group">
          <button class="icon-button" aria-label="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
          </button>
          <div class="logo-wrap" aria-label="YouTube home">
            <div class="logo-mark">
              <span class="play-triangle"></span>
            </div>
            <div class="logo-text">YouTube</div>
            <span class="country-code">C</span>
          </div>
        </div>

        <div class="search-wrap">
          <label class="search-bar" aria-label="Search">
            <input type="text" placeholder="Search" value="" />
            <button class="search-button" aria-label="Search button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 015.6 13.7l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z"/></svg>
            </button>
          </label>
          <button class="icon-button mic-button" aria-label="Search with your voice">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 003-3V7a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a1 1 0 112 0v1a7 7 0 01-6 6.93V21h3v2H10v-2h3v-2.07A7 7 0 014 13v-1a1 1 0 112 0v1a5 5 0 1010 0v-1z"/></svg>
          </button>
        </div>

        <div class="right-group">
          <button class="create-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
            <span>Create</span>
          </button>
          <button class="icon-button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6V11a7 7 0 10-14 0v5l-2 2v1h18v-1l-2-2z"/></svg>
          </button>
          <div class="avatar">D</div>
        </div>
      </header>

      <div class="content-wrap">
        <aside class="sidebar">
          <nav class="nav-group">
            <button class="nav-item active">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 7-2 2-1-1V20h-6v-5H9v5H3v-9l-1 1-2-2 9-7z"/></svg>
              <span>Home</span>
            </button>
            <button class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5V3h8v2h2v2h2v12H4V7h2V5zm2 2h4V5h-4zm8 4H6v8h12z"/></svg>
              <span>Shorts</span>
            </button>
            <button class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 2v8H5V5zm-8 10l6-4-6-4v8z"/></svg>
              <span>Subscriptions</span>
            </button>
          </nav>

          <div class="divider"></div>

          <nav class="nav-group">
            <button class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
              <span>You</span>
            </button>
            <button class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5h-2v6l5 3 1-1.7-4-2.3V7z"/></svg>
              <span>History</span>
            </button>
            <button class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 012 2v14l-7-4-7 4V5a2 2 0 012-2zm8 2H9v8.2l3-1.7 3 1.7V5z"/></svg>
              <span>Library</span>
            </button>
          </nav>
        </aside>

        <main class="main-panel">
          <div class="chip-row" id="chipRow">
            <button class="chip active">All</button>
            <button class="chip">Gaming</button>
            <button class="chip">Music</button>
            <button class="chip">Live</button>
            <button class="chip">Tech</button>
            <button class="chip">Watched</button>
            <button class="chip">Recently Uploaded</button>
            <button class="chip">New to you</button>
          </div>

          <section class="video-grid" id="videoGrid"></section>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
